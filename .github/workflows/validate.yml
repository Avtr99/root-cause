name: Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'skills/**'
      - '.claude-plugin/**'
      - '.codex-plugin/**'
      - '.cursor-plugin/**'
      - '.devin-plugin/**'
      - '.grok-plugin/**'
      - '.agents/**'
      - '.github/plugin/**'
      - 'plugin.json'
      - '.github/workflows/validate.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install skills-ref
        run: pip install "git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref"

      - name: Validate skill against Agent Skills spec
        run: skills-ref validate skills/antidote

      - name: Validate adapter manifests
        run: |
          set -e
          for f in \
            plugin.json \
            .claude-plugin/marketplace.json \
            .claude-plugin/plugin.json \
            .codex-plugin/plugin.json \
            .cursor-plugin/plugin.json \
            .devin-plugin/plugin.json \
            .grok-plugin/plugin.json \
            .grok-plugin/marketplace.json \
            .agents/plugins/marketplace.json \
            .github/plugin/marketplace.json \
            .github/plugin/antidote/plugin.json; do
            echo "Checking $f"
            python3 -c "import json; json.load(open('$f'))"
          done

      - name: Check Copilot skill synchronization
        run: cmp --silent skills/antidote/SKILL.md .github/plugin/antidote/skills/antidote/SKILL.md

      - name: Validate Copilot skill against Agent Skills spec
        run: skills-ref validate .github/plugin/antidote/skills/antidote

      - name: Check SKILL.md size
        run: |
          lines=$(wc -l < skills/antidote/SKILL.md)
          if [ "$lines" -gt 500 ]; then
            echo "SKILL.md is $lines lines (max 500)"
            exit 1
          fi
          echo "SKILL.md: $lines lines"
